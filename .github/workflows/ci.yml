name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'      # Monday 06:00 UTC — uncached, as a fresh machine

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks scans commits, and the default shallow clone
      # gives it nothing to read.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning install.sh macos/*.sh .githooks/pre-commit

      - name: zsh syntax
        run: |
          sudo apt-get install -y zsh
          for f in shared/*.zsh shared/zshrc.common shared/.zshenv \
                   shared/.zprofile macos/*.zsh macos/.zshrc \
                   linux/*.zsh linux/.zshrc; do
            [ -f "$f" ] && zsh -n "$f"
          done

      # The binary rather than gitleaks-action: the action wraps the same scan
      # in licence and SARIF-upload machinery that fails the job on its own
      # errors ("stderr is not empty", 0 bytes scanned). This runs the same
      # check as .githooks/pre-commit, so local and CI results agree.
      - name: gitleaks
        run: |
          V=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact .

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # -y accepts every group. Without a TTY the script declines everything,
      # so this also proves the non-interactive path works.
      - name: install
        run: ./install.sh -y
        env:
          CI: 1

      - name: idempotence — a second run must succeed
        run: ./install.sh -y
        env:
          CI: 1

      # The runner ships /usr/share/zsh group-writable, which a stock Ubuntu
      # box does not (actions/runner-images#12526). Debian's /etc/zsh/zshrc
      # calls a bare `compinit`, and bare compinit prompts about writable
      # completion dirs -- with no terminal it aborts and unfunctions itself.
      #
      # Fixed here rather than in the shell config: only the -i flag suppresses
      # that prompt, and nothing can pass a flag to a compinit call inside a
      # system file. Working around it in .zshrc would mean weakening every
      # machine to accommodate one broken runner, so the runner is corrected to
      # match reality instead.
      - name: normalize zsh completion dir permissions
        run: |
          sudo chown -R root:root /usr/share/zsh
          sudo chmod -R g-w,o-w /usr/share/zsh
          zsh -c 'autoload -Uz compaudit; compaudit' && echo "still insecure" || echo "clean"

      # Catches broken rc files nothing else surfaces: a login shell that
      # prints to stderr is a bug even when it exits 0.
      - name: login shell must be silent
        run: |
          errors=$(zsh -lic 'exit' 2>&1 >/dev/null) || true
          [ -z "$errors" ] || { echo "$errors"; exit 1; }

      # .zshenv must put a real node on PATH: shell functions are invisible to
      # raw PATH lookups, so `env node` shebangs and non-interactive shells
      # need the binary itself. Skipped when nvm is absent.
      - name: node must work non-interactively
        run: |
          [ -r "$HOME/.nvm/alias/default" ] || { echo "no nvm — skipped"; exit 0; }
          zsh -c 'node --version' || {
            echo "node unreachable in a non-interactive shell"; exit 1; }
          printf '#!/usr/bin/env node\nprocess.exit(0)\n' > /tmp/shebang.js
          chmod +x /tmp/shebang.js
          zsh -c '/tmp/shebang.js' || {
            echo "env-node shebang failed"; exit 1; }

      # node/npm/npx must stay plain binaries. Wrapping them in lazy-loading
      # functions caused a recursion storm: when the helper went missing from
      # a shell's environment, Homebrew's command_not_found_handler re-invoked
      # the wrapper until FUNCNEST tripped, emitting ~700 errors per command.
      - name: node must not be a shell function
        run: |
          [ -r "$HOME/.nvm/alias/default" ] || { echo "no nvm — skipped"; exit 0; }
          for c in node npm npx; do
            t=$(zsh -lic "type -w $c" 2>/dev/null | tail -1)
            case "$t" in
              *function*) echo "$c is a shell function: $t"; exit 1 ;;
            esac
          done
          # A shell missing the loader must still run npm, not recurse.
          out=$(zsh -lic 'unset -f _nvm_load 2>/dev/null; npm --version' 2>&1)
          case "$out" in
            *FUNCNEST*|*_nvm_load*) echo "recursion returned: $out"; exit 1 ;;
          esac

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v7

      # The runner ships these, and the Brewfile declares them as casks — brew
      # refuses to install over an existing app rather than clobbering it.
      - name: remove preinstalled apps that collide with casks
        run: sudo rm -rf "/Applications/Firefox.app" "/Applications/Google Chrome.app"

      # Cache the DOWNLOAD cache only. Caching the Cellar leaves kegs
      # present-but-unregistered on top of the runner's own Homebrew and
      # breaks brew bundle with "File exists" / "No such keg".
      - name: cache homebrew downloads
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ hashFiles('macos/Brewfile') }}
          restore-keys: brew-

      - name: Brewfile parses
        run: brew bundle list --file=macos/Brewfile >/dev/null

      # Never applies anything: --dry only reads and reports drift. Applying
      # real defaults on a runner proves nothing and risks the rest of the job.
      - name: defaults dry run
        run: ./macos/defaults.sh --dry

      - name: dock dry run
        run: ./macos/dock.sh --dry

      # Casks are excluded: ~50 GUI apps would take longer than the timeout and
      # exercise Homebrew rather than this repo. The formulae path is the part
      # worth proving.
      - name: install (formulae only, no casks)
        run: |
          grep -v '^cask ' macos/Brewfile > /tmp/Brewfile.nocask
          brew bundle --file=/tmp/Brewfile.nocask || true
          ./install.sh -y
        env:
          CI: 1
          HOMEBREW_BUNDLE_FILE: /tmp/Brewfile.nocask

      - name: idempotence — a second run must succeed
        run: ./install.sh -y
        env:
          CI: 1
          HOMEBREW_BUNDLE_FILE: /tmp/Brewfile.nocask

      - name: login shell must be silent
        run: |
          errors=$(zsh -lic 'exit' 2>&1 >/dev/null) || true
          [ -z "$errors" ] || { echo "$errors"; exit 1; }

      # .zshenv must put a real node on PATH: shell functions are invisible to
      # raw PATH lookups, so `env node` shebangs and non-interactive shells
      # need the binary itself. Skipped when nvm is absent.
      - name: node must work non-interactively
        run: |
          [ -r "$HOME/.nvm/alias/default" ] || { echo "no nvm — skipped"; exit 0; }
          zsh -c 'node --version' || {
            echo "node unreachable in a non-interactive shell"; exit 1; }
          printf '#!/usr/bin/env node\nprocess.exit(0)\n' > /tmp/shebang.js
          chmod +x /tmp/shebang.js
          zsh -c '/tmp/shebang.js' || {
            echo "env-node shebang failed"; exit 1; }

      # node/npm/npx must stay plain binaries. Wrapping them in lazy-loading
      # functions caused a recursion storm: when the helper went missing from
      # a shell's environment, Homebrew's command_not_found_handler re-invoked
      # the wrapper until FUNCNEST tripped, emitting ~700 errors per command.
      - name: node must not be a shell function
        run: |
          [ -r "$HOME/.nvm/alias/default" ] || { echo "no nvm — skipped"; exit 0; }
          for c in node npm npx; do
            t=$(zsh -lic "type -w $c" 2>/dev/null | tail -1)
            case "$t" in
              *function*) echo "$c is a shell function: $t"; exit 1 ;;
            esac
          done
          # A shell missing the loader must still run npm, not recurse.
          out=$(zsh -lic 'unset -f _nvm_load 2>/dev/null; npm --version' 2>&1)
          case "$out" in
            *FUNCNEST*|*_nvm_load*) echo "recursion returned: $out"; exit 1 ;;
          esac
