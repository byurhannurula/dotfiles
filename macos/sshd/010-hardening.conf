# Installed to /etc/ssh/sshd_config.d/ by macos/harden.sh.
#
# sshd keeps the FIRST value it reads for each option, and includes load in
# name order, so 010- wins over Apple's 100-macos.conf.

PasswordAuthentication no
# macOS sets UsePAM yes, and PAM asks for the account password through
# keyboard-interactive, so this must be off too or passwords still work.
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers __USER__
