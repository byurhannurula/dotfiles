# Trackpad gestures — the macOS muscle memory, on Linux.
#
# Install to ~/.config/libinput-gestures.conf.
# Needs: libinput-gestures, wmctrl, xdotool, libinput-tools, and the user in
# the `input` group. Group membership only applies at the NEXT LOGIN — until
# then gestures are silently dead.
#   https://github.com/bulletmark/libinput-gestures

# Three fingers left/right = switch workspace, as on macOS.
gesture swipe left  3 xdotool key super+ctrl+Right
gesture swipe right 3 xdotool key super+ctrl+Left

# Four fingers up = workspace overview.
gesture swipe up    4 xdotool key super+w

# Pinch in = show desktop.
gesture pinch in    2 xdotool key super+d
